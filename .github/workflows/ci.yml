name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # --no-build blocks sdist builds (setup-script execution) for all
      # third-party deps — githubactions:S8541. --no-binary-package exempts
      # only our own package so the editable install can still be built.
      - name: Install dependencies
        run: uv sync --frozen --no-build --no-binary-package code-review-agent --extra dev --extra context

      # Invoke tools from the synced venv directly: `uv run` may rebuild the
      # editable project (executing build scripts) on each step — flagged as
      # githubactions:S8541. `.venv/bin/*` is faster and provably runs no setup.
      - name: Lint (ruff)
        run: .venv/bin/ruff check src tests

      - name: Type check (mypy)
        run: .venv/bin/mypy

      - name: Run tests
        env:
          PYTHONWARNINGS: ignore
        run: .venv/bin/pytest --ignore=tests/e2e --maxfail=1 --disable-warnings -q --cov --cov-report=term-missing:skip-covered

      - name: Run parser eval corpus
        env:
          PYTHONWARNINGS: ignore
        run: .venv/bin/python -m code_review.evals.cli --execution parser

  image-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build agent image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.agent
          push: false
          load: true
          tags: code-review-agent:ci-scan

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@e368e328979b113139d6f9068e03accaed98a518 # v0.34.1
        with:
          image-ref: code-review-agent:ci-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          version: v0.69.2
